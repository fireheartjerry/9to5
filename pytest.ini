[pytest]
# Collect ONLY from tests/ (matches CI's `unittest discover -s tests`). Without this, bare
# `pytest` also discovers root-level probe SCRIPTS (test_health_probe.py, test_phase2_project.py)
# that call sys.exit() at import and crash collection (INTERNALERROR).
testpaths = tests
# Accept both test_*.py and *_test.py patterns so verify commands from the brain work either way
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
# -ra: short summary of failures/skips at the end. --strict-markers: an unregistered marker is an
# error, not a silent skip (catches typo'd @pytest.mark.x). NOT `-n auto` (would hard-require xdist)
# and NOT `-p no:cacheprovider` (would disable --lf/--ff fast re-runs).
addopts = -ra --strict-markers
# Per-test timeout safety net: no test may stall the suite. A hung test (e.g. a spawned
# subprocess that never exits) FAILS loudly at 60s and names itself, instead of hanging CI
# forever. `thread` method works cross-platform (signal-based doesn't on Windows). Individual
# tests that legitimately need longer can override with @pytest.mark.timeout(N).
timeout = 60
timeout_method = thread
# Markers for the fast/slow split. Heavy tests (subprocess, e2e, integration loops) are marked
# `slow` (auto-tagged in conftest.py); the fast lane is `pytest -m "not slow"`.
markers =
    slow: heavyweight test (subprocess/e2e/integration) -- excluded from the fast lane
    test_cli_features: tests for _extractDecisionPoints, buildStepSpec, and getDecisionPoints CLI features
