name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both Python versions only on PRs; pushes to main run just 3.12.
        python-version: >-
          ${{ (github.event_name == 'pull_request')
              && fromJSON('["3.11","3.12"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Fast lane (parallel)
        run: python -m pytest -m "not slow" -n auto --dist loadscope -q

      - name: Slow lane (PR only)
        if: github.event_name == 'pull_request'
        run: python -m pytest -m slow -n auto --dist loadscope -q

      - name: Validate workflow definitions
        run: python validate_workflows.py

  smoke:
    # Exercises the real entrypoints (main.py arg handling) that test discovery does not cover:
    # the offline full-pipeline dry-run and the virtual-operator E2E suite. PR-gated -- the
    # --e2e step is the most expensive in the file, so it does not run on every push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Dry-run smoke (full pipeline, offline)
        run: python main.py --dry-run --goal "ci smoke build a thing" --hours 1 --no-web

      - name: Virtual-operator E2E suite
        run: python main.py --e2e
