name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Validate workflow definitions
        run: python validate_workflows.py

  smoke:
    # Exercises the real entrypoints (main.py arg handling) that unittest discovery
    # does not cover: the offline full-pipeline dry-run and the virtual-operator E2E suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dry-run smoke (full pipeline, offline)
        run: python main.py --dry-run --goal "ci smoke build a thing" --hours 1 --no-web

      - name: Virtual-operator E2E suite
        run: python main.py --e2e
