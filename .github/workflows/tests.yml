name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

# Per-event groups: a push to main must NOT cancel the nightly exhaustive run (schedule and
# push previously shared the group "tests-refs/heads/main"). Only PR runs auto-cancel their
# superseded predecessors.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NINE_TO_FIVE_TEST_PROGRESS: "1"
  NINE_TO_FIVE_TEST_HEARTBEAT_SECONDS: "30"

jobs:
  classify:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
      workflow_only: ${{ steps.paths.outputs.workflow_only }}
      tooling_only: ${{ steps.paths.outputs.tooling_only }}
      core: ${{ steps.paths.outputs.core }}
      affected_ok: ${{ steps.affected.outputs.affected_ok }}
      affected_reason: ${{ steps.affected.outputs.affected_reason }}
      affected_targets: ${{ steps.affected.outputs.affected_targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          # A force-push (or shallow history) can hand us a base SHA that no longer exists;
          # validate it and FAIL CLOSED (treat everything as changed) instead of silently
          # diffing one commit.
          if [[ -n "$base" ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=""
          fi
          if [[ -n "$base" ]]; then
            git diff --name-only "$base"...HEAD > /tmp/changed.txt || echo "." > /tmp/changed.txt
          else
            echo "." > /tmp/changed.txt
          fi
          if [[ ! -s /tmp/changed.txt ]]; then
            echo "." > /tmp/changed.txt
          fi

          docs_only=true
          workflow_only=true
          tooling_only=true
          core=false
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ ! "$f" =~ ^(docs/|.*\.md$|LLM_MAP\.md$|CAPABILITIES\.md$|README\.md$) ]]; then
              docs_only=false
            fi
            if [[ ! "$f" =~ ^(\.github/workflows/|workflows/|validate_workflows\.py|tests/workflows/.*\.py) ]]; then
              workflow_only=false
            fi
            if [[ ! "$f" =~ ^(tools/|tests/platform/test_(repo_map|tools|dev_commands)\.py|\.repo-map\.json) ]]; then
              tooling_only=false
            fi
            if [[ ! "$f" =~ ^(docs/|.*\.md$|\.github/workflows/|tools/|\.repo-map\.json) ]]; then
              core=true
            fi
          done < /tmp/changed.txt

          # Fail closed: a change set mixing "excluded" categories (e.g. docs + tools) used to
          # produce all-false outputs -- every job skipped and the PR went green with ZERO tests
          # run. If no single specialized lane claims the whole change set, run the core lanes.
          if [[ "$core" == "false" && "$docs_only" == "false" && "$workflow_only" == "false" && "$tooling_only" == "false" ]]; then
            core=true
          fi

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            docs_only=false
            workflow_only=false
            tooling_only=false
            core=true
          fi

          {
            echo "docs_only=$docs_only"
            echo "workflow_only=$workflow_only"
            echo "tooling_only=$tooling_only"
            echo "core=$core"
          } >> "$GITHUB_OUTPUT"

      - id: affected
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && -s /tmp/changed.txt && "$(head -c1 /tmp/changed.txt)" != "." ]]; then
            python tools/ci_affected.py < /tmp/changed.txt >> "$GITHUB_OUTPUT"
          else
            {
              echo "affected_ok=false"
              echo "affected_reason=not-a-PR-or-unknown-change-set"
              echo "affected_targets="
            } >> "$GITHUB_OUTPUT"
          fi

  docs:
    needs: classify
    if: needs.classify.outputs.docs_only == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Repo-map drift check
        run: python tools/repo_map.py --check

  workflow-validation:
    needs: classify
    if: needs.classify.outputs.workflow_only == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Validate workflow definitions
        run: python validate_workflows.py
      - name: Workflow tests
        run: python -m pytest tests/workflows/test_validate_workflows.py tests/workflows/test_workflows.py tests/workflows/test_workflows_registry.py tests/workflows/test_workflow_registry.py -q

  tooling:
    needs: classify
    if: needs.classify.outputs.tooling_only == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Repo-map drift check
        run: python tools/repo_map.py --check
      - name: Tooling tests
        run: python -m pytest tests/platform/test_repo_map.py tests/platform/test_tools.py tests/platform/test_dev_commands.py -q

  fast:
    needs: classify
    if: needs.classify.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Compile tests (corrupt files fail in seconds, not at collection)
        run: python -m compileall -q tests
      - name: Affected tests (PR, fail-closed) or full fast lane
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ needs.classify.outputs.affected_ok }}" == "true" ]]; then
            echo "affected-only lane: ${{ needs.classify.outputs.affected_targets }}"
            python -m pytest ${{ needs.classify.outputs.affected_targets }} -n auto --dist loadscope -q
          else
            echo "full fast lane (reason: ${{ needs.classify.outputs.affected_reason }})"
            python -m pytest -m "not slow" -n auto --dist loadscope -q
          fi
      - name: Validate workflow definitions
        run: python validate_workflows.py

  slow:
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Slow lane
        run: python -m pytest -m slow -n auto --dist loadscope --durations=30 -q

  dry-run-smoke:
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Dry-run smoke
        run: python main.py --dry-run --goal "ci smoke build a thing" --hours 1 --no-web

  e2e-smoke:
    needs: classify
    if: github.event_name == 'push' && needs.classify.outputs.core == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Virtual-operator E2E suite
        run: python main.py --e2e

  nightly-fast-py311:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Fast lane (3.11 compatibility)
        run: python -m pytest -m "not slow" -n auto --dist loadscope -q

  exhaustive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "requirements*.txt"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Exhaustive slow lane
        env:
          NINE_TO_FIVE_FUZZ_SEEDS: "150"
        run: python -m pytest -m slow -n auto --dist loadscope --durations=50 -vv
      - name: Dry-run smoke
        run: python main.py --dry-run --goal "nightly exhaustive smoke" --hours 1 --no-web
      - name: Virtual-operator E2E suite
        run: python main.py --e2e
