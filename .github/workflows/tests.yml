name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Validation tier to run manually"
        required: true
        default: fast
        type: choice
        options: [fast, exhaustive]
  schedule:
    - cron: "17 8 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NINE_TO_FIVE_TEST_PROGRESS: "1"
  NINE_TO_FIVE_TEST_HEARTBEAT_SECONDS: "30"

jobs:
  main-validation:
    # This repository deliberately runs only trusted main/nightly/manual code on the
    # workstation runner. Do not add pull_request or pull_request_target triggers.
    runs-on: [self-hosted, Windows, X64, 9to5-ci]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Cheap integrity gates
        run: |
          python -m compileall -q tests
          python tools/repo_map.py --check
          python validate_workflows.py
      - name: Capacity-aware validation schedule
        shell: bash
        run: |
          python tools/ci_schedule.py --lanes-json '[
            {"name":"fast","seconds":45,"heavy":true},
            {"name":"slow","seconds":120,"heavy":true},
            {"name":"dry-run","seconds":60,"heavy":false},
            {"name":"e2e","seconds":60,"heavy":false}
          ]'
      - name: Fast lane
        run: python -m pytest -m "not slow" -n auto --dist loadscope -q
      - name: Slow lane
        run: python -m pytest -m slow -n auto --dist loadscope --durations=30 -q
      - name: Dry-run smoke
        run: python main.py --dry-run --goal "ci smoke build a thing" --hours 1 --no-web
      - name: Virtual-operator E2E suite
        run: python main.py --e2e
      - name: Test Brain mapping audit
        run: python tools/test_brain.py --mapping-audit --mapping-fail-under 0.99

  nightly-exhaustive:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'exhaustive')
    runs-on: [self-hosted, Windows, X64, 9to5-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv pip install --system -r requirements.txt -r requirements-dev.txt
      - name: Exhaustive compatibility suite
        run: python -m pytest -n auto --dist loadscope -q
